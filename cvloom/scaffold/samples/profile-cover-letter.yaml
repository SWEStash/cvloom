template: cover-letter/standard
output_filename: cover-letter
job_context:
  company: "Target Company"
  role: "Senior Software Engineer"
  # Who you are writing to. Left unset, the letter addresses your locale's
  # generic salutee ("Hiring Manager" in en, "Responsable de Contratación" in
  # es) — spelling it out here would put an English literal in every language.
  # hiring_manager: "Dana Reyes"
  #
  # The greeting and sign-off come from the locale too. Override them here when
  # the language needs it — Spanish salutations agree with the addressee:
  # greeting: "Estimada"
  # closing: "Un cordial saludo,"
  notes: |
    I am writing to express my interest in the **Senior Software Engineer** position
    at Target Company.

    My experience building scalable systems and developer tooling makes me a strong
    fit for this role. I would welcome the opportunity to discuss further.
