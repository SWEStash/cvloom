template: cv/ats-single
output_filename: example-job-cv

section_order: [skills, work, projects, education]

sections:
  work: true
  education: true
  skills: true
  projects: true

# Narrow individual sections. A section not named here keeps every entry —
# `education` is untouched below, so all of it renders. An entry with no tags
# does not match a `tags` list, so only tag the sections you mean to filter.
select:
  work:
    tags: [python, kafka, aws, microservices]
  projects:
    tags: [python]
  skills:
    categories: [Languages, "Data & Messaging", "Infrastructure & Cloud"]

job_context:
  company: Stripe
  role: Senior Infrastructure Engineer

overlays:
  basics:
    headline: "Senior Infrastructure Engineer"
    summary: >
      Infrastructure engineer with 8+ years building high-throughput
      distributed systems. Deep Kafka and AWS experience at scale.

  work:
    - match: {company: "Acme Corp"}
      highlights:
        mode: pick
        items: [kafka-pipeline, microservices-migration]
        append:
          - "Designed zero-downtime deployment for 200-node Kafka cluster."
