[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvloom"
version = "0.6.0"
description = "CLI tool to manage CV/resume content as a single source of truth in YAML, generate tailored PDF/HTML outputs per job application."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "cv",
    "resume",
    "yaml",
    "ats",
    "job-application",
    "mcp",
    "cover-letter",
    "json-resume",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "markdown-it-py>=3.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/SWEStash/cvloom"
Repository = "https://github.com/SWEStash/cvloom"
Issues = "https://github.com/SWEStash/cvloom/issues"
Changelog = "https://github.com/SWEStash/cvloom/blob/main/CHANGELOG.md"

[project.scripts]
cvloom = "cvloom.cli:cli"
cvloom-mcp = "cvloom.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-jsonschema",
    "cvloom[docx]",
    "cvloom[extract]",
]
# Capped below mcp 2.0.0, which removed the bundled `mcp.server.fastmcp.FastMCP`
# that mcp_server.py uses (FastMCP was split into the standalone `fastmcp`
# package — itself still mcp<2). 1.x is the current, maintained line (1.29.0)
# and keeps the bundled FastMCP; migrating to mcp 2.0's low-level server API is
# a tracked follow-up, not needed for cvloom's 16 stdio tools.
mcp = [
    "mcp>=1.0,<2",
]
# Extra PDF text extractors for `build --extract-text`. Optional because poppler's
# `pdftotext` binary is the one that matters most and is a system package, not a
# Python one — these two add engines that read the document by different means, so
# agreement between them is worth more than any single engine's verdict.
extract = [
    "pypdf>=4.0",
    "pdfminer.six>=20231228",
]
docx = [
    "python-docx>=1.1",
]
ai = [
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cvloom"]

# Deny-by-default: the sdist ships ONLY these paths. Without an explicit allowlist
# hatchling walks the tree and would include private, globally-gitignored dirs
# (e.g. .local/, .git/) that its sdist builder does not treat as ignored.
[tool.hatch.build.targets.sdist]
include = [
    "/cvloom",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

# Optional extractors: present with `[extract]`, absent without it, and the code
# imports them inside functions guarded by `available_engines()`. An inline
# `type: ignore` would be correct in one environment and an "unused ignore" error
# in the other, so the exemption lives here instead.
[[tool.mypy.overrides]]
module = ["pypdf.*", "pdfminer.*"]
ignore_missing_imports = true
