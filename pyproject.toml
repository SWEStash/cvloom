[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvloom"
version = "0.6.0"
description = "CLI tool to manage CV/resume content as a single source of truth in YAML, generate tailored PDF/HTML outputs per job application."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "cv",
    "resume",
    "yaml",
    "ats",
    "job-application",
    "mcp",
    "cover-letter",
    "json-resume",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "markdown-it-py>=3.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/SWEStash/cvloom"
Repository = "https://github.com/SWEStash/cvloom"
Issues = "https://github.com/SWEStash/cvloom/issues"
Changelog = "https://github.com/SWEStash/cvloom/blob/main/CHANGELOG.md"

[project.scripts]
cvloom = "cvloom.cli:cli"
cvloom-mcp = "cvloom.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-jsonschema",
    "cvloom[docx]",
]
mcp = [
    "mcp>=1.0",
]
docx = [
    "python-docx>=1.1",
]
ai = [
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cvloom"]

# Deny-by-default: the sdist ships ONLY these paths. Without an explicit allowlist
# hatchling walks the tree and would include private, globally-gitignored dirs
# (e.g. .local/, .claude/) that its sdist builder does not treat as ignored.
[tool.hatch.build.targets.sdist]
include = [
    "/cvloom",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
