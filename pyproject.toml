[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvloom"
version = "0.4.0"
description = "CLI tool to manage CV/resume content as a single source of truth in YAML, generate tailored PDF/HTML outputs per job application."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "markdown-it-py>=3.0",
    "rich>=13.0",
]

[project.scripts]
cvloom = "cvloom.cli:cli"
cvloom-mcp = "cvloom.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-jsonschema",
    "python-docx>=1.1",
]
mcp = [
    "mcp>=1.0",
]
docx = [
    "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["cvloom"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
