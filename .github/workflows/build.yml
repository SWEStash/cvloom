name: Build & Deploy CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # `pdftotext` is the poppler extraction engine. Without it the suite runs on
      # four engines instead of five, and the declared/measured ATS ratings in
      # tests/test_ats_ratings.py are derived from a smaller set than they were
      # measured against — cv/sidebar-compact is flagged by poppler alone.
      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check cvloom tests scripts
      - name: Check formatting
        run: uv run ruff format --check cvloom tests scripts
      - name: Type-check
        run: uv run mypy cvloom
      - name: Run tests
        run: uv run pytest

  conformance:
    name: PDF conformance (veraPDF)
    needs: test
    runs-on: ubuntu-latest
    # veraPDF is a Java CLI, so it cannot be a dev dependency and contributors are
    # not expected to have it. The local suite asserts the half that can regress
    # from a change in this repo — that the XMP identifier is written, and that a
    # variant moves no glyph. Only this job can say the document actually conforms.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install WeasyPrint system deps
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libffi-dev
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Install veraPDF
        run: |
          curl -sL -o verapdf.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q verapdf.zip
          cd verapdf-greenfield-*
          cat > auto.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>${HOME}/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Batch files" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar verapdf-izpack-installer-*.jar auto.xml
      - name: Build every template under each declared variant, and validate
        run: uv run python scripts/check_pdf_conformance.py --verapdf "$HOME/verapdf/verapdf"

  build:
    name: Build (public mode)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install WeasyPrint system deps
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libffi-dev
      - name: Build all example profiles (public mode)
        working-directory: examples
        run: |
          for profile in profiles/*.yaml; do
            name=$(basename "$profile" .yaml)
            uv run cvloom build --profile "$name" --public
          done
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: examples/dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
