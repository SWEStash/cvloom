name: Build & Deploy CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check cvloom tests
      - name: Check formatting
        run: uv run ruff format --check cvloom tests
      - name: Type-check
        run: uv run mypy cvloom
      - name: Run tests
        run: uv run pytest

  build:
    name: Build (public mode)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install WeasyPrint system deps
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libffi-dev
      - name: Build all profiles (public mode)
        run: |
          for profile in profiles/*.yaml; do
            name=$(basename "$profile" .yaml)
            uv run cvloom build --profile "$name" --public
          done
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
