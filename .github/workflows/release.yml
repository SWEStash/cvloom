name: Release

# Publishes cvloom to PyPI via trusted publishing (OIDC) — no API tokens.
# - Pushing a semver tag (v*.*.*) builds and publishes to PyPI, gated by the
#   `pypi` environment (manual approval = the publish gate).
# - A manual run (workflow_dispatch) publishes to TestPyPI for rehearsals.
#
# Automated releases after v0.6.0 are handled by release-please.yml (which
# publishes in-workflow, since token-created tags don't trigger this one). This
# workflow covers the manual v0.6.0 cut (a real-user tag push) and rehearsals.
#
# Prerequisites (configured once, in the web UIs):
#   * PyPI + TestPyPI: a trusted publisher (or pending publisher) for project
#     `cvloom`, bound to owner `SWEStash`, repo `cvloom`, workflow `release.yml`,
#     and the matching environment (`pypi` / `testpypi`).
#   * GitHub: environments `pypi` and `testpypi`; add a required reviewer to
#     `pypi` so publishing to the real index requires a manual click.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    # Real PyPI only on a pushed tag.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cvloom
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  testpypi-publish:
    name: Publish to TestPyPI
    # TestPyPI rehearsal only on a manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cvloom
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
