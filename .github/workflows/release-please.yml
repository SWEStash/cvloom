name: release-please

# Automated releases AFTER the hand-cut v0.6.0.
#
# On every push to main, release-please maintains a "release PR" that bumps the
# version in pyproject.toml and updates CHANGELOG.md from Conventional Commits.
# Merging that PR creates the git tag + GitHub Release, and the `publish` job
# below then builds and publishes to PyPI via trusted publishing (OIDC).
#
# Why publish here instead of letting release.yml's tag trigger fire: tags/
# releases created by the default GITHUB_TOKEN do NOT trigger other workflows
# (GitHub suppresses this to avoid recursion), so the tag-triggered release.yml
# would never run for an automated release. Publishing in this same workflow —
# gated on release-please's `release_created` output — sidesteps that without a
# personal access token. release.yml remains the path for manual tag pushes
# (the v0.6.0 cut) and TestPyPI rehearsals.
#
# Config: release-please-config.json + .release-please-manifest.json.
# bump-minor-pre-major / bump-patch-for-minor-pre-major keep pre-1.0 semantics
# (breaking -> MINOR, feat -> PATCH) until the manifest crosses 1.0.0.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    name: Publish to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cvloom
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
