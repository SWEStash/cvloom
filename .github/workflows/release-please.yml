name: release-please

# The single release + publish path.
#
# On every push to main, release-please maintains a "release PR" that bumps the
# version in pyproject.toml and updates CHANGELOG.md from Conventional Commits.
# Merging that PR creates the git tag + GitHub Release, and the `publish` job
# below then builds and publishes to PyPI via trusted publishing (OIDC).
#
# Publishing happens in this workflow (gated on release-please's `release_created`
# output) rather than a separate tag-triggered one, because tags/releases created
# by the default GITHUB_TOKEN do NOT trigger other workflows (GitHub suppresses
# this to avoid recursion) — so a separate publish workflow would never fire for
# an automated release, and a personal access token would be needed to force it.
#
# PyPI trusted publisher must be registered for THIS workflow filename
# (release-please.yml), environment `pypi`.
#
# Config: release-please-config.json + .release-please-manifest.json.
# bump-minor-pre-major / bump-patch-for-minor-pre-major keep pre-1.0 semantics
# (breaking -> MINOR, feat -> PATCH) until the manifest crosses 1.0.0.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      # release-please's python updater rewrites pyproject.toml and
      # cvloom/__init__.py, but has never heard of uv.lock — which records the
      # workspace member's own version. Left alone the lock goes stale on every
      # release, and the next local `uv run` silently rewrites it into whatever
      # commit happens to come next. Nothing downstream breaks (uv build reads
      # pyproject.toml, and CI does not use --locked); it is the stray diff that
      # is the problem. Fix it on the release PR, where the bump was made.
      - name: Check out the release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@v7

      - name: Sync uv.lock to the released version
        if: ${{ steps.release.outputs.pr }}
        run: |
          uv lock
          # `if` rather than `&&`, so a clean lock is not read as a step failure.
          if git diff --quiet uv.lock; then
            echo "uv.lock already matches pyproject.toml — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock to the released version" uv.lock
          git push

  publish:
    name: Publish to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cvloom
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
